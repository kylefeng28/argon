[workspace]
resolver = "2"
members = [
    "crates/argon-core",
    "crates/argon-gfx",
    "crates/argon-audio",
    "crates/argon-lua",
    "crates/argon-shell",
    "crates/argon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argon-core = { path = "crates/argon-core" }
argon-gfx = { path = "crates/argon-gfx" }
argon-audio = { path = "crates/argon-audio" }
argon-lua = { path = "crates/argon-lua" }
argon-shell = { path = "crates/argon-shell" }

wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
mlua = { version = "0.10", features = ["luau", "luau-jit", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "6"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ropey = "1.6"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
